function patchPage(){const affected=heroes.filter(h=>heroChanges[h.id]||hitVolumes[h.id]||heroFixes[h.id]);return title('PATCH INTELLIGENCE',`S5「${patch.title}」`,`${patch.releasedUS} 米国 / ${patch.releasedJP} 日本 · Liveノート確認 ${patch.checkedAt}`)+`<div class="banner">${esc(patch.note)}</div><div class="grid3"><a class="card" href="#/heroes/doctrine"><span class="eyebrow">HERO 54</span><h2 style="margin-top:12px">ドクトリン</h2><p>Support / Survivor。試用版からの変更値を収録。</p></a><a class="card" href="#/heroes/sombra"><span class="eyebrow">ROLE REWORK</span><h2 style="margin-top:12px">ソンブラ → Support</h2><p>Hotfix / Cyberspace / Conspiratorへ更新。</p></a><a class="card" href="#/maps/grimsvotn"><span class="eyebrow">NEW ESCORT</span><h2 style="margin-top:12px">グリムスヴォトン</h2><p>新マップ。データ不足の行を0%扱いしません。</p></a></div><div class="sectionhead"><h2>ヒーロー別の変更</h2><span class="note">能力・当たり判定・修正を収録</span></div><section class="card">${affected.map(h=>`<details><summary>${roleText(h.role)} / ${esc(h.ja)} ${patchBadge(h)}</summary>${heroPatch(h.id,true)}<a class="note" href="#/heroes/${h.id}">ヒーロー詳細 →</a></details>`).join('')}</section><div class="sectionhead"><h2>マップの追加・更新</h2></div><div class="grid2">${Object.entries(mapChanges).map(([id,[label,t]])=>`<a class="card" href="#/maps/${id}"><span class="badge">${esc(label)}</span><h3 style="margin-top:10px">${esc(M(id).name)}</h3><p>${esc(t)}</p></a>`).join('')}</div><div class="sectionhead"><h2>全体・モード別</h2></div><section class="card">${globalChanges.map(([k,t])=>`<details><summary>${esc(k)}</summary><p>${esc(t)}</p></details>`).join('')}<details><summary>Stadiumの調整 <span class="badge">通常5v5の推薦へは適用しません</span></summary>${stadiumChanges.map(([k,t])=>`<p><strong>${esc(k)}</strong> · ${esc(t)}</p>`).join('')}</details></section><div class="sectionhead"><h2>データの出典と範囲</h2></div><section class="card"><p>${esc(snapshotMeta.note)}</p><p class="note">収録統計：${snapshotMeta.heroCount}ヒーロー / 全マップ平均＋${snapshotMeta.mapCount}マップ。PC・Asia・全ランク・ライバルの条件。取得できなかった条件はデータ不足です。</p><p class="note">カタログ：${heroes.length}ヒーロー / 通常5v5の${coreMaps.length}マップ＋その他${maps.length-coreMaps.length}。通常5v5のマップは公式統計の選択肢と照合。季節版・Controlのステージは親マップで管理。Stadium専用・PvE・ヒーローマスターは対象外。</p><p class="note">戦術シナジー、対面スコア、構成タイプはサイトの編集判断。同時編成勝率は未取得です。アップデート内容から勝率を推測生成していません。</p>${patch.sources.map(s=>`<a class="listrow" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} ↗</a>`).join('')}<a class="listrow" href="${esc(snapshotMeta.sourceUrl)}" target="_blank" rel="noopener">ユーザー指定の公式Hero Statistics ↗</a></section>`;}
function settings(){return `<div class="settings">${title('YOUR PLAYBOOK','自分に合わせる。')}<section class="card"><h2>表示とデータ</h2><label class="check"><input type="checkbox" id="advanced" ${advanced?'checked':''}>詳細表示（スコア内訳）</label><label class="check" style="margin-top:15px"><input type="checkbox" id="demo" ${demo?'checked':''}>架空のUIサンプル統計を表示</label><p class="note">通常表示は公式の取得時点の統計。DEMO値はおすすめ計算へ使いません。</p>${globalFilters()}</section><section class="card"><h2>マイヒーロープール <span class="badge">${pool.length}体</span></h2><p>このブラウザに保存。S5のロール変更も反映されます。</p><div class="tabs">${heroes.map(h=>`<button data-pool="${h.id}" aria-pressed="${pool.includes(h.id)}" class="${pool.includes(h.id)?'primary':''}">${pool.includes(h.id)?'✓ ':''}${esc(h.ja)}</button>`).join('')}</div></section><section class="card"><h2>評価の計算方法</h2><p class="note">重み：マップ35 / 味方25 / 敵20 / 参考メタ10 / 個人10。未評価は除外して重みを再正規化。</p><p class="note">Map Advantage＝マップ勝率−全マップ勝率。Map Score＝50＋5×差分pt×min(1, Pick/3)。0〜100に制限。統計なしの既存マップはタイプ一致88・不一致64。新マップの未評価は除外。</p><p class="note">参考メタ：Win Score＝clamp((勝率−40)×5)、Pick Score＝clamp(Pick×5)、Ban Score＝clamp(Ban×2)。70/20/10で平均し、BAN未取得時は残りを再正規化。Pick3%未満は50へ寄せる。clampは0〜100に制限する処理です。</p><p class="note">シナジーは登録ペアの編集値、その他は同タイプ80・異タイプ62。対面は登録した組合せのみ。統計的シナジーではありません。</p><p class="note">Low Sample＝Pick1%未満の代理表示。試合数は未公開のためBayesian Shrinkage・統計的Confidenceの算出はできません。すべてConfidence Low。個人成績は未接続。</p><a class="note" href="#/patch">出典・収録パッチ・更新内容 →</a></section><section class="card"><h2>その他のページ</h2><div class="tabs"><a class="chip" href="#/patch">Patch</a><a class="chip" href="#/meta">Meta</a><a class="chip" href="#/compare">Compare</a><a class="chip" href="#/team">Team</a><a class="chip" href="#/swap">Swap</a></div></section></div>`;}
function bind(){
 document.querySelectorAll('.avatar img').forEach(img=>img.onerror=()=>img.remove());
 document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;render()});
 document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const id=b.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save('favorites',favorites);render()});
 document.querySelectorAll('[data-pool]').forEach(b=>b.onclick=()=>{const id=b.dataset.pool;pool=pool.includes(id)?pool.filter(x=>x!==id):[...pool,id];save('pool',pool);render()});
 ['input','region','tier','rq'].forEach(k=>{if($('#gf-'+k))$('#gf-'+k).onchange=e=>{statFilters[k]=e.target.value;render()}});
 if($('#quickGo'))$('#quickGo').onclick=()=>{form.map=$('#quickMap').value;setMyRole($('#quickRole').value);location.hash='/assistant'};
 if($('#filterSearch'))$('#filterSearch').oninput=e=>{query=e.target.value;const pos=e.target.selectionStart;render();$('#filterSearch').focus();$('#filterSearch').setSelectionRange(pos,pos)};
 if($('#sort'))$('#sort').onchange=e=>{sort=e.target.value;render()};
 if($('#direction'))$('#direction').onclick=()=>{desc=!desc;render()};
 if($('#catalogSort'))$('#catalogSort').onchange=e=>{catalogSort=e.target.value;catalogDesc=catalogSort!=='name';render()};
 if($('#catalogDirection'))$('#catalogDirection').onclick=()=>{catalogDesc=!catalogDesc;render()};
 if($('#showAllHeroes'))$('#showAllHeroes').onclick=()=>{role='All';query='';catalogSort='name';catalogDesc=false;render()};
 if($('#low'))$('#low').onchange=e=>{low=e.target.checked;render()};
 if($('#minPick'))$('#minPick').onchange=e=>{minPick=Math.max(0,Math.min(100,+e.target.value));render()};
 if($('#rankView')){$('#rankView').onclick=()=>{tierView=false;render()};$('#tierView').onclick=()=>{tierView=true;render()}};
 if($('#mapGrid')){const update=()=>{$('#mapGrid').innerHTML=maps.filter(m=>matches(m,mapQuery)&&(mapScope==='all'||m.scope===mapScope)&&(mapMode==='All'||m.mode===mapMode)).map(mapCard).join('')||'<div class="empty">該当するマップがありません。</div>'};$('#mapSearch').oninput=e=>{mapQuery=e.target.value;update()};$('#modeFilter').onchange=e=>{mapMode=e.target.value;update()};$('#scopeFilter').onchange=e=>{mapScope=e.target.value;update()};update();}
 if($('#results')){updateResults();['map','myRole','onlyPool'].forEach(id=>$('#'+id).onchange=e=>{if(id==='map')form.map=e.target.value;if(id==='myRole'){setMyRole(e.target.value);$('#allies'+(form.role==='Tank'?0:form.role==='Damage'?2:4)).value='';}if(id==='onlyPool')form.onlyPool=e.target.checked;updateResults()});['allies','enemies'].forEach(t=>slotRoles.forEach((_,i)=>$('#'+t+i).onchange=e=>{form[t][i]=e.target.value;updateResults()}));}
 if($('#swapResults')){updateSwap();['map','current','problem'].forEach(id=>$('#'+id).onchange=e=>{form[id]=e.target.value;updateSwap()})};
 if($('#teamResult')){updateTeam();$('#map').onchange=e=>{form.map=e.target.value;updateTeam()};team.forEach((_,i)=>$('#team'+i).onchange=e=>{team[i]=e.target.value;updateTeam()})};
 comparison.forEach((_,i)=>{if($('#compare'+i))$('#compare'+i).onchange=e=>{if(e.target.value){comparison[i]=e.target.value;render()}}});
 if($('#advanced'))$('#advanced').onchange=e=>{advanced=e.target.checked;save('advanced',advanced)};
 if($('#demo'))$('#demo').onchange=e=>{demo=e.target.checked;save('demo',demo);render()};
}
function render(){
 const [page,id]=(location.hash.slice(2)||'').split('/');
 $('#demoBtn').textContent=demo?'DEMO 表示中':'DEMOを見る';
 document.title=(page==='heroes'&&H(id)?H(id).ja+'｜相性・マップ・S5更新':page==='maps'&&M(id)?M(id).name+'｜おすすめヒーロー':page==='patch'?'S5更新・出典':'ヒーロー選択支援')+' — OW Pick Lab';
 const view=page==='heroes'?(id?heroDetail(id):heroesPage()):page==='maps'?(id?mapDetail(id):mapsPage()):page==='assistant'?assistant():page==='swap'?swap():page==='team'?teamPage():page==='compare'?compare():page==='meta'?meta():page==='settings'?settings():page==='patch'?patchPage():home();
 $('#app').innerHTML=view;bind();
}
$('#demoBtn').onclick=()=>{demo=!demo;save('demo',demo);render()};
let theme=read('theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
document.body.classList.toggle('dark',theme==='dark');
$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.body.classList.toggle('dark',theme==='dark');save('theme',theme)};
$('#searchBtn').onclick=()=>{$('#searchDialog').showModal();$('#globalSearch').focus()};
$('#closeSearch').onclick=()=>$('#searchDialog').close();
$('#globalSearch').oninput=e=>{const q=e.target.value.trim();$('#searchResults').innerHTML=q?[...heroes.filter(h=>matches(h,q)).map(h=>({path:'heroes/'+h.id,name:h.ja,type:roleText(h.role)})),...maps.filter(m=>matches(m,q)).map(m=>({path:'maps/'+m.id,name:m.name,type:m.mode}))].slice(0,20).map(x=>`<a class="listrow" href="#/${x.path}"><strong>${esc(x.name)}</strong><span class="note">${x.type}</span></a>`).join('')||'<p>一致する候補がありません。</p>':'';$('#searchResults').querySelectorAll('a').forEach(a=>a.onclick=()=>$('#searchDialog').close())};
window.onhashchange=()=>{query='';role='All';render();window.scrollTo(0,0)};
render();

})();
</script>
<noscript>このサイトの操作にはJavaScriptを有効にしてください。</noscript></body>
</html>
