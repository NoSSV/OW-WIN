function meta(){return title('META WATCH','メタを知る。')+banner()+`<section class="card"><h2>現在メタ・推移はデータ不足</h2><p>実測のパッチ別データが接続されると、Tier、前回との差分、上昇・下降を表示します。現時点では環境順位を生成しません。</p><a class="primary" style="display:inline-block;padding:12px 18px;border-radius:5px" href="https://overwatch.blizzard.com/en-us/rates/" target="_blank" rel="noopener">公式統計を確認 ↗</a></section>`;}
function settings(){return `<div class="settings">${title('YOUR PLAYBOOK','自分に合わせる。')}<section class="card"><h2>表示とデータ</h2><label class="check"><input type="checkbox" id="advanced" ${advanced?'checked':''}>詳細表示（スコア内訳を表示）</label><label class="check" style="margin-top:15px"><input type="checkbox" id="demo" ${demo?'checked':''}>架空のUIサンプル統計を表示</label><p class="note">公式統計未接続。ランク・地域・PC/Console・モードは、対応データ取得後に有効化します。現在はこれらのフィルターを装って表示しません。</p></section><section class="card"><h2>マイヒーロープール <span class="badge">${pool.length}体</span></h2><p>登録したヒーローはこのブラウザに保存されます。</p><div class="tabs">${heroes.map(h=>`<button data-pool="${h.id}" class="${pool.includes(h.id)?'primary':''}">${pool.includes(h.id)?'✓ ':''}${h.ja}</button>`).join('')}</div></section><section class="card"><h2>評価の計算方法</h2><p class="note">マップ35 / 味方25 / 敵20 / メタ10 / 個人10。データがない項目は除外し、利用できる項目の合計で再正規化。スコアは勝率ではありません。</p><p class="note">マップ：構成タイプ一致88、不一致64。シナジー：登録ペアの編集値、その他は同タイプ80・異タイプ62。敵相性：登録済みの対面のみ。メタ・個人成績：現在未接続。</p><p class="note">使用率は試合数や統計的信頼度を表しません。少数試合の補正・Bayesian Shrinkageは実測試合数の取得後に導入します。プレビューの信頼度はLowです。</p></section></div>`;}
function bind(){document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{role=b.dataset.role;render()});document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{let id=b.dataset.fav;favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save('favorites',favorites);render()});document.querySelectorAll('[data-pool]').forEach(b=>b.onclick=()=>{let id=b.dataset.pool;pool=pool.includes(id)?pool.filter(x=>x!==id):[...pool,id];save('pool',pool);render()});if($('#quickGo'))$('#quickGo').onclick=()=>{form.map=$('#quickMap').value;form.role=$('#quickRole').value;location.hash='/assistant'};
if($('#filterSearch'))$('#filterSearch').oninput=e=>{query=e.target.value;let pos=e.target.selectionStart;render();$('#filterSearch').focus();$('#filterSearch').setSelectionRange(pos,pos)};if($('#sort'))$('#sort').onchange=e=>{sort=e.target.value;render()};if($('#direction'))$('#direction').onclick=()=>{desc=!desc;render()};if($('#low'))$('#low').onchange=e=>{low=e.target.checked;render()};if($('#minPick'))$('#minPick').onchange=e=>{minPick=Math.max(0,Math.min(100,+e.target.value));render()};if($('#rankView')){$('#rankView').onclick=()=>{tierView=false;render()};$('#tierView').onclick=()=>{tierView=true;render()}};
if($('#mapGrid')){let update=()=>{let q=$('#mapSearch').value.toLowerCase(),mode=$('#modeFilter').value;$('#mapGrid').innerHTML=maps.filter(m=>m.name.toLowerCase().replace('’',"'").includes(q.replace('’',"'"))&&(mode==='すべてのモード'||mode===m.mode)).map(mapCard).join('')||'<div class="empty">該当するマップはありません。</div>'};$('#mapSearch').oninput=update;$('#modeFilter').onchange=update;}
if($('#results')){updateResults();['map','myRole','onlyPool'].forEach(id=>$('#'+id).onchange=e=>{if(id==='map')form.map=e.target.value;if(id==='myRole')form.role=e.target.value;if(id==='onlyPool')form.onlyPool=e.target.checked;updateResults()});['allies','enemies'].forEach(t=>slotRoles.forEach((r,i)=>$('#'+t+i).onchange=e=>{form[t][i]=e.target.value;updateResults()}));}
if($('#swapResults')){updateSwap();['map','current','problem'].forEach(id=>$('#'+id).onchange=e=>{form[id]=e.target.value;updateSwap()})};if($('#teamResult')){updateTeam();$('#map').onchange=e=>{form.map=e.target.value;updateTeam()};team.forEach((_,i)=>$('#team'+i).onchange=e=>{team[i]=e.target.value;updateTeam()})};comparison.forEach((_,i)=>{if($('#compare'+i))$('#compare'+i).onchange=e=>{comparison[i]=e.target.value;render()}});if($('#advanced'))$('#advanced').onchange=e=>{advanced=e.target.checked;save('advanced',advanced)};if($('#demo'))$('#demo').onchange=e=>{demo=e.target.checked;save('demo',demo);render()};}
function render(){let [page,id]=(location.hash.slice(2)||'').split('/');$('#demoBtn').textContent=demo?'DEMO 表示中':'DEMOを見る';let view=page==='heroes'?(id?heroDetail(id):heroesPage()):page==='maps'?(id?mapDetail(id):mapsPage()):page==='assistant'?assistant():page==='swap'?swap():page==='team'?teamPage():page==='compare'?compare():page==='meta'?meta():page==='settings'?settings():home();$('#app').innerHTML=view;bind();}
$('#demoBtn').onclick=()=>{demo=!demo;save('demo',demo);render()};let theme=read('theme',matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.body.classList.toggle('dark',theme==='dark');$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.body.classList.toggle('dark',theme==='dark');save('theme',theme)};$('#searchBtn').onclick=()=>{$('#searchDialog').showModal();$('#globalSearch').focus()};$('#closeSearch').onclick=()=>$('#searchDialog').close();$('#globalSearch').oninput=e=>{let q=e.target.value.trim().toLowerCase();$('#searchResults').innerHTML=q?[...heroes.filter(h=>`${h.name} ${h.ja}`.toLowerCase().includes(q)).map(h=>({path:'heroes/'+h.id,name:h.ja,type:h.role})),...maps.filter(m=>m.name.toLowerCase().replace('’',"'").includes(q.replace('’',"'"))).map(m=>({path:'maps/'+m.id,name:m.name,type:m.mode}))].slice(0,15).map(x=>`<a class="listrow" href="#/${x.path}"><strong>${esc(x.name)}</strong><span class="note">${x.type}</span></a>`).join('')||'<p>一致する候補がありません。</p>':'';$('#searchResults').querySelectorAll('a').forEach(a=>a.onclick=()=>$('#searchDialog').close())};window.onhashchange=()=>{query='';role='All';render();window.scrollTo(0,0)};render();

})();
</script><noscript>このサイトの操作にはJavaScriptを有効にしてください。</noscript></body></html>
