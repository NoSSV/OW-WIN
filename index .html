  if(!picks.length)return `<div class="empty"><h3>${mobileState.onlyPool?'使える候補を追加しよう':'評価データがありません'}</h3><p class="note">${mobileState.onlyPool?(sameRolePool?'登録したヒーローは味方が使用中です。別の候補を追加してください。':`${esc(mobileRoleNames[mobileState.role])}のヒーローが未登録です。`):'マップとロールを選び直してください。'}</p><button class="primary" data-action="pool">使えるヒーローを選ぶ</button></div>`;
  const first=picks[0],stat=analysis.stats[first.hero.id];
  return `<article class="best"><div class="bestBanner"><span class="display">01 / BEST PICK</span><span>${first.hero.id===current?'使用中のヒーロー':'おすすめ'}</span></div><div class="bestBody"><div class="heroResultRow">${avatar(first.hero)}<div class="resultHero">${labelRole(first.hero.role)}<h3>${esc(first.hero.ja)}</h3><small>${esc(first.hero.name)}</small></div><div class="score"><strong>${first.score}</strong><span>参考点 / 100</span></div></div><div class="bestMeta"><span>全体勝率 <b>${percent(stat?.win)}</b></span><span class="confidence">信頼度 Low / 参考評価</span></div><details class="why"><summary>なぜこのヒーロー？</summary>${renderPickReason(first)}</details></div></article>${picks.slice(1).map((pick,i)=>`<article class="runner"><span class="rank">0${i+2}</span>${avatar(pick.hero)}<div class="runnerInfo"><h3>${esc(pick.hero.ja)}</h3><p>${pick.hero.id===current?'使用中 · ':''}参考評価 / 信頼度 Low</p></div><div class="score"><strong>${pick.score}</strong><span>/ 100</span></div><button class="runnerWhy" data-action="pick-reason" data-hero="${pick.hero.id}" aria-label="${esc(pick.hero.ja)}のおすすめ理由">理由</button></article>`).join('')}`;
}

function renderMobileComposition(){
  const result=analysis.composition;if(!result)return '';
  const a=result.assessment;
  return `<section class="composition" aria-labelledby="compositionTitle"><p class="eyebrow">YOUR TEAM / 5 PLAYERS</p><div class="compositionHead"><div><h2 id="compositionTitle">この構成の参考点</h2><span class="compositionType">${esc(a.label)}</span></div><div class="score"><strong>${a.score??'—'}</strong><span>/ 100</span></div></div><p class="note">マップ適性＋戦術シナジー。敵の入力は不要です。<br>信頼度 Low / 実際の編成勝率ではありません。</p>${result.changes.length?`<h3 style="margin-top:18px;font-size:16px">変えるなら、この枠</h3>${result.changes.slice(0,2).map(change=>`<div class="changeCard">${labelRole(change.role)} <span class="note">${esc(change.label)}${change.slot===analysis.own?'（自分）':''}</span><div class="changeRow">${avatar(change.from,true)}<div>${esc(change.from.ja)}</div><span aria-hidden="true">→</span>${avatar(change.to,true)}<div>${esc(change.to.ja)}</div></div><div class="changeAction"><span class="delta">構成 ${change.before} → ${change.after}（+${change.delta}）</span><button data-action="apply-change" data-index="${change.slot}" data-hero="${change.to.id}">この候補を試す</button></div><p class="note" style="margin-top:7px">${esc(change.reasons[0])}</p></div>`).join('')}<p class="note" style="margin-top:12px">変更候補は1人ずつの評価です。試すと全体を再計算します。</p>`:'<p class="note" style="margin-top:12px">今の構成を維持する選択もOK。2点以上改善する候補はありません。</p>'}</section>`;
}

function renderDataFoot(){
  return `<details class="dataFoot"><summary>ⓘ データと計算について</summary><p>通常5v5用 · ${heroes.length}ヒーロー / ${mobileMaps.length}マップ。統計条件はPC・Asia・全ランク・ライバルのロールキューです。</p><p>${mobileState.sourceMode==='provided'?'全体勝率・メタ参考値：提供いただいた表（2026/10/09受領）。元表の計測日時・パッチ・集計条件は未記載です。':'全体勝率・メタ参考値：2026/10/07取得の公式統計です。'}</p><p>マップ別：${esc(snapshotMeta.checkedAt)}取得の公式スナップショット。マップ平均との差は同じ取得データ内で計算します。未取得のマップ適性は、登録があれば戦術分類による参考値を使います。</p><p>最新パッチとの一致は未確認です。試合数は未公開のため信頼度はLowです。自動更新はありません。</p><ul><li>通常比率：マップ35%、味方25%、敵20%、メタ10%、個人成績10%。</li><li>未入力・未取得の項目を除外し、分かる項目だけで比率を再計算します。</li><li>シナジー・カウンターは能力と戦術分類からの推定です。</li></ul><a href="${esc(snapshotMeta.sourceUrl)}" target="_blank" rel="noopener">公式Hero Statisticsを確認 ↗</a></details><p class="disclaimer">Blizzard Entertainmentの非公式ファンツールです。<br>Overwatchおよび関連する名称・画像は各権利者に帰属します。</p>`;
}

function renderMobileApp(){
  for(const key of ['team','enemies'])if($(`#${key}Details`))openSections[key]=$(`#${key}Details`).open;
  analysis=computeMobile(mobileState);const map=mobileMaps.find(m=>m.id===mobileState.map);
  const poolCount=mobileState.pool.filter(id=>mobileHero(id)?.role===mobileState.role).length;
  $('#mobileApp').innerHTML=`<header class="appHeader"><span class="brandMark" aria-hidden="true">${mark}</span><div class="brandText"><strong>OW PICK</strong><small>PICK ASSISTANT</small></div><button class="installSmall" data-action="install">ホーム<br>画面に追加</button><button class="iconButton" data-action="settings" aria-label="設定と使い方">${gear}</button></header><main class="content"><h1 class="intro">この試合、<span>何を出す？</span></h1><section aria-label="試合の入力"><p class="fieldCaption"><b>01</b> マップ</p><button class="mapButton" data-action="map" aria-label="マップを変更：${esc(map.ja)}"><svg class="mapGlyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m3 5 6-2 6 2 6-2v16l-6 2-6-2-6 2V5Z"/><path d="M9 3v16M15 5v16"/></svg><span class="mapName"><strong class="display">${esc(map.name.toUpperCase())}</strong><small>${esc(map.ja)} · ${esc(modeName(map.mode))}</small></span><span class="chevron" aria-hidden="true">›</span></button><div class="roleField"><p class="fieldCaption"><b>02</b> 自分のロール</p><div class="roleButtons" aria-label="自分のロール">${mobileRoles.map(role=>`<button class="roleButton ${role}" data-action="role" data-role="${role}" aria-pressed="${mobileState.role===role}">${roleIcon(role)}${esc(mobileRoleNames[role])}</button>`).join('')}</div></div>${renderLineup('team')}${renderLineup('enemies')}<div class="poolBar"><label class="poolSwitch"><input id="onlyPool" type="checkbox" ${mobileState.onlyPool?'checked':''}>使えるヒーローだけ</label><button class="poolEdit" data-action="pool">登録 ${poolCount}体 / 編集 ›</button></div></section><section id="results" class="results" aria-labelledby="resultsTitle" tabindex="-1"><div class="resultHead"><h2 id="resultsTitle">あなたのおすすめ</h2><small>入力すると<br>すぐに再計算</small></div><p class="matchContext">味方 ${analysis.allyCount}人${analysis.enemyCount?` · 敵 ${analysis.enemyCount}人`:' · 敵なしで評価'}${mobileState.onlyPool?' · ヒーロープール限定':''}</p><div id="recommendationList">${renderRecommendations()}</div></section>${renderMobileComposition()}${renderDataFoot()}</main><nav class="bottomBar" aria-label="試合中の操作"><button class="nextMatch" data-action="new-match">次の試合<br>入力クリア</button><button class="primary" data-action="results">おすすめを見る ↓</button></nav>`;
  applyMobileTheme();
}

function renderPicker(){
  if(!pickerState)return;
  const kind=pickerState.kind,query=$('#pickerSearch').value||'';
  $('#pickerSearch').closest('.searchField').hidden=kind==='reason';
  if(kind==='map'){
    $('#pickerEyebrow').textContent='SELECT MAP';$('#pickerTitle').textContent='マップを選ぶ';
    $('#pickerToolbar').innerHTML='';
    const groups=['Control','Escort','Hybrid','Push','Flashpoint'];
    $('#pickerOptions').innerHTML=groups.map(mode=>{
      const list=mobileMaps.filter(m=>m.mode===mode&&mobileMatches(m,query));
      return list.length?`<p class="mapGroup">${esc(modeName(mode))}</p>${list.map(m=>`<button class="mapOption" data-action="choose-map" data-map="${m.id}" aria-pressed="${mobileState.map===m.id}"><div><strong class="display">${esc(m.name.toUpperCase())}</strong><small>${esc(m.ja)}</small></div>${mobileState.map===m.id?'<span class="optionCheck" style="position:static">✓</span>':'<span class="chevron" aria-hidden="true">›</span>'}</button>`).join('')}`:'';
    }).join('')||'<p class="empty">一致するマップがありません。</p>';
    $('#pickerFooter').textContent='通常5v5の31マップ。日本語・英語で検索できます。';
  }else if(kind==='hero'||kind==='pool'){
    const pool=kind==='pool',role=pool?pickerState.role:compositionSlots[pickerState.index].role;
    $('#pickerEyebrow').textContent=pool?'MY HERO POOL':`${pickerState.side==='team'?'YOUR TEAM':'ENEMY TEAM'} / ${role.toUpperCase()}`;
    $('#pickerTitle').textContent=pool?'使えるヒーロー':pickerState.side==='team'&&pickerState.index===mobileOwnSlot(mobileState)?'自分の現在のヒーロー':`${pickerState.side==='enemies'?'敵の':''}${compositionSlots[pickerState.index].label}`;
    $('#pickerToolbar').innerHTML=pool?`<div class="poolTabs">${mobileRoles.map(r=>`<button class="${r}" data-action="pool-role" data-role="${r}" aria-pressed="${r===role}">${roleIcon(r)}${esc(mobileRoleNames[r])}</button>`).join('')}</div><div class="selectionTools"><span>${heroes.filter(h=>h.role===role&&mobileState.pool.includes(h.id)).length}体 登録済み</span><button data-action="pool-all">このロールを全て登録</button></div>`:`<div class="selectionTools"><span>${mobileRoleNames[role]}から選択</span><button data-action="empty-slot">この枠を空にする</button></div>`;
    const list=heroes.filter(h=>h.role===role&&mobileMatches(h,query));
    $('#pickerOptions').innerHTML=`<div class="heroPickerGrid">${list.map(hero=>{
      const selected=pool?mobileState.pool.includes(hero.id):mobileState[pickerState.side][pickerState.index]===hero.id;
      const used=!pool&&mobileState[pickerState.side].some((id,i)=>i!==pickerState.index&&id===hero.id);
      return `<button class="heroOption ${hero.role}" data-action="${pool?'toggle-pool':'choose-hero'}" data-hero="${hero.id}" aria-pressed="${selected}" ${used?'disabled':''} aria-label="${esc(hero.ja)}${used?'（選択済み）':pool?selected?'を登録解除':'を登録':'を選択'}">${selected?'<span class="optionCheck">✓</span>':''}${avatar(hero)}<strong>${esc(hero.ja)}</strong>${used?'<span class="used">選択済み</span>':''}</button>`;
    }).join('')}</div>${list.length?'':'<p class="empty">一致するヒーローがいません。</p>'}`;
    $('#pickerFooter').innerHTML=pool?'<button class="primary" data-action="close-picker" style="width:100%">登録して戻る</button>':'選んだヒーローで、すぐに再計算します。';
  }else if(kind==='reason'){
    const pick=analysis.picks.find(p=>p.hero.id===pickerState.hero);if(!pick)return;
    $('#pickerEyebrow').textContent='WHY THIS PICK';$('#pickerTitle').textContent=`${pick.hero.ja}をおすすめする理由`;
    $('#pickerToolbar').innerHTML='';$('#pickerOptions').innerHTML=renderPickReason(pick);
    $('#pickerFooter').textContent=`参考点 ${pick.score} / 100 · 信頼度 Low`;
  }
}

function openPicker(config){
  pickerState=config;$('#pickerSearch').value='';renderPicker();$('#picker').showModal();$('#picker [data-action="close-picker"]').focus();
}

function closePicker(){if($('#picker').open)$('#picker').close();pickerState=null;}

function renderSettings(){
  $('#settingsBody').innerHTML=`<section class="settingsGroup" id="installHelp"><h3>ホーム画面から開く</h3><p class="note">スマホのホーム画面に置くと、次の試合ですぐに開けます。</p><button class="primary installHelpButton" data-action="install-prompt">${installEvent?'ホーム画面に追加する':'追加方法を確認する'}</button><ol class="installSteps"><li>このページをスマホのChromeで開く</li><li>右上の「︙」をタップ</li><li>「ホーム画面に追加」→「インストール」または「追加」</li></ol><p class="note">iPhoneの場合はSafariの共有メニュー → ホーム画面に追加。表示名はブラウザにより異なります。</p></section><section class="settingsGroup"><h3>表示テーマ</h3><div class="themeButtons">${[['system','端末に合わせる'],['light','白'],['dark','暗い']].map(([id,label])=>`<button data-action="theme" data-theme="${id}" aria-pressed="${mobileState.theme===id}">${label}</button>`).join('')}</div></section><section class="settingsGroup"><h3>全体勝率の参考データ</h3><select id="mobileSource" aria-label="全体勝率の参考データ"><option value="provided" ${mobileState.sourceMode==='provided'?'selected':''}>提供いただいた表 / 10月9日受領</option><option value="official" ${mobileState.sourceMode==='official'?'selected':''}>公式スナップショット / 10月7日取得</option></select><p class="note">マップ別は10月7日の公式スナップショットで固定。統計のパッチIDと試合数は未公開です。最新版の勝率とは限りません。</p></section><section class="settingsGroup"><h3>このスマホに保存</h3><p class="note">マップ、ロール、構成、使えるヒーローをこのブラウザに保存します。ブラウザのデータを消すと設定も消えます。</p></section>${waitingWorker?'<section class="settingsGroup"><h3>新しいツールが使えます</h3><button class="primary" data-action="update-app">保存して更新する</button></section>':''}<section class="settingsGroup"><h3>使い方</h3><p class="note">マップとロールだけで候補を表示。味方を追加すると連携も評価します。敵は入力しなくてOKです。自分を含む5人を選ぶと、下に構成点数と変更候補が出ます。</p></section>`;
}

function openSettings(){renderSettings();if(!$('#settings').open)$('#settings').showModal();}

function afterMobileChange(){persistMobile();renderMobileApp();}

async function requestInstall(){
  if(!installEvent){openSettings();$('#installHelp').scrollIntoView({block:'start'});notifyMobile('Chromeの︙ → ホーム画面に追加');return;}
  const event=installEvent;installEvent=null;
  try{await event.prompt();const result=await event.userChoice;if(result.outcome==='accepted')notifyMobile('ホーム画面への追加を進めています。');}catch{openSettings();}
  if($('#settings').open)renderSettings();
}

document.addEventListener('click',async event=>{
  const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;
  const action=button.dataset.action;
  if(action==='map')openPicker({kind:'map'});
  else if(action==='role'){if(changeMobileRole(mobileState,button.dataset.role))afterMobileChange();}
  else if(action==='slot')openPicker({kind:'hero',side:button.dataset.side,index:Number(button.dataset.index)});
  else if(action==='pool')openPicker({kind:'pool',role:mobileState.role});
  else if(action==='close-picker')closePicker();
  else if(action==='choose-map'){if(chooseMobileMap(mobileState,button.dataset.map)){closePicker();afterMobileChange();}}
  else if(action==='choose-hero'||action==='empty-slot'){
    if(pickerState?.kind==='hero'&&chooseMobileHero(mobileState,pickerState.side,pickerState.index,action==='empty-slot'?'':button.dataset.hero)){closePicker();afterMobileChange();}
  }else if(action==='clear-side'){
    mobileState[button.dataset.side]=['','','','',''];afterMobileChange();
  }else if(action==='toggle-pool'){
    if(toggleMobilePool(mobileState,button.dataset.hero)){afterMobileChange();renderPicker();}
  }else if(action==='pool-role'){
    pickerState.role=button.dataset.role;$('#pickerSearch').value='';renderPicker();
  }else if(action==='pool-all'){
    for(const hero of heroes.filter(h=>h.role===pickerState.role))if(!mobileState.pool.includes(hero.id))mobileState.pool.push(hero.id);
    afterMobileChange();renderPicker();
  }else if(action==='results'){
    $('#results').scrollIntoView({behavior:reducedMotion()?'auto':'smooth',block:'start'});$('#results').focus({preventScroll:true});
  }else if(action==='new-match'){
    resetMobileMatch(mobileState);afterMobileChange();window.scrollTo({top:0,behavior:reducedMotion()?'auto':'smooth'});notifyMobile('次の試合の入力をクリアしました。');
  }else if(action==='pick-reason')openPicker({kind:'reason',hero:button.dataset.hero});
  else if(action==='apply-change'){
    if(chooseMobileHero(mobileState,'team',Number(button.dataset.index),button.dataset.hero)){afterMobileChange();notifyMobile('構成とおすすめを再計算しました。');}
  }else if(action==='settings')openSettings();
  else if(action==='close-settings')$('#settings').close();
  else if(action==='theme'){
    mobileState.theme=button.dataset.theme;persistMobile();applyMobileTheme();renderSettings();
  }else if(action==='install'||action==='install-prompt')await requestInstall();
  else if(action==='update-app'&&waitingWorker){persistMobile();waitingWorker.postMessage({type:'SKIP_WAITING'});}
});

document.addEventListener('change',event=>{
  if(event.target.id==='onlyPool'){mobileState.onlyPool=event.target.checked;afterMobileChange();}
  if(event.target.id==='mobileSource'){mobileState.sourceMode=event.target.value==='official'?'official':'provided';afterMobileChange();}
});
$('#pickerSearch').addEventListener('input',renderPicker);
for(const id of ['picker','settings'])$(`#${id}`).addEventListener('click',event=>{
  if(event.target===$(`#${id}`)){const rect=event.target.getBoundingClientRect();if(event.clientY<rect.top||event.clientX<rect.left||event.clientX>rect.right){id==='picker'?closePicker():$('#settings').close();}}
});
document.addEventListener('error',event=>{if(event.target.tagName==='IMG')event.target.hidden=true;},true);
window.matchMedia?.('(prefers-color-scheme: dark)').addEventListener?.('change',applyMobileTheme);
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();installEvent=event;if($('#settings').open)renderSettings();});
window.addEventListener('appinstalled',()=>{installEvent=null;notifyMobile('ホーム画面への追加が完了しました。');});

// Private Site pages must keep their server-side sign-in boundary on every launch.
// The standalone static GitHub can additionally use an offline app shell.
if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.endsWith('.chatgpt.site')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js',{scope:'./'}).then(registration=>{
      waitingWorker=registration.waiting;
      registration.addEventListener('updatefound',()=>{
        const worker=registration.installing;worker?.addEventListener('statechange',()=>{
          if(worker.state==='installed'&&navigator.serviceWorker.controller){waitingWorker=worker;if($('#settings').open)renderSettings();}
        });
      });
    }).catch(()=>{});
  });
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(waitingWorker&&!reloading){reloading=true;location.reload();}});
}
renderMobileApp();
if(!loadedMobile.available)persistMobile();

})();
</script>
</body>
</html>
